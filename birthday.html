<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日祝福</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            z-index: 10;
        }
        
        .birthday-title {
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: pulse 2s infinite;
        }
        
        .message {
            font-size: 1.5rem;
            line-height: 1.8;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }
        
        .birthday-person {
            color: #FFD700;
            font-weight: bold;
            font-size: 2rem;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.8);
        }
        
        .balloons {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        
        .balloon {
            position: absolute;
            width: 50px;
            height: 70px;
            background: #ff4081;
            border-radius: 50%;
            bottom: -100px;
            animation: floatUp 8s linear infinite;
            box-shadow: inset -10px -10px 0 rgba(0, 0, 0, 0.07);
        }
        
        .balloon:before {
            content: "▲";
            font-size: 20px;
            color: inherit;
            display: block;
            text-align: center;
            width: 100%;
            position: absolute;
            bottom: -18px;
        }
        
        .balloon:after {
            content: "";
            position: absolute;
            top: 70px;
            left: 50%;
            height: 100px;
            width: 1px;
            background: rgba(255, 255, 255, 0.5);
        }
        
        /* 改进的蛋糕样式 - 更真实 */
        .cake-container {
            width: 280px;
            margin: 30px auto;
            position: relative;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.3));
        }
        
        .cake {
            position: relative;
            width: 100%;
            height: 150px;
        }
        
        /* 蛋糕底层 */
        .cake-base {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: #f8c8dc;
            border-radius: 50% 50% 10px 10px;
            z-index: 1;
            box-shadow: 
                inset 0 -5px 0 rgba(0, 0, 0, 0.1),
                inset 0 5px 0 rgba(255, 255, 255, 0.3);
        }
        
        /* 蛋糕中间层 */
        .cake-middle {
            position: absolute;
            bottom: 50px;
            left: 15%;
            width: 70%;
            height: 50px;
            background: #ffb6c1;
            border-radius: 50% 50% 10px 10px;
            z-index: 2;
            box-shadow: 
                inset 0 -5px 0 rgba(0, 0, 0, 0.08),
                inset 0 5px 0 rgba(255, 255, 255, 0.4);
        }
        
        /* 蛋糕顶层 */
        .cake-top {
            position: absolute;
            bottom: 90px;
            left: 25%;
            width: 50%;
            height: 40px;
            background: #ff9999;
            border-radius: 50% 50% 10px 10px;
            z-index: 3;
            box-shadow: 
                inset 0 -5px 0 rgba(0, 0, 0, 0.06),
                inset 0 5px 0 rgba(255, 255, 255, 0.5);
        }
        
        /* 糖霜滴落效果 */
        .icing {
            position: absolute;
            width: 25px;
            height: 25px;
            background: white;
            border-radius: 50%;
            z-index: 4;
        }
        
        .icing-1 {
            bottom: 40px;
            left: 20%;
        }
        
        .icing-2 {
            bottom: 35px;
            left: 50%;
        }
        
        .icing-3 {
            bottom: 40px;
            right: 20%;
        }
        
        /* 蜡烛 */
        .candles {
            position: absolute;
            bottom: 130px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 30px;
            z-index: 5;
        }
        
        .candle {
            width: 12px;
            height: 35px;
            background: #fff;
            border-radius: 5px 5px 0 0;
            position: relative;
            box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.1);
        }
        
        .candle:nth-child(2) {
            background: #ffeb3b;
        }
        
        .candle:nth-child(3) {
            background: #4caf50;
        }
        
        .flame {
            width: 15px;
            height: 25px;
            background: linear-gradient(to bottom, #ff9800, #ffeb3b);
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 20px #ff9800, 0 0 40px rgba(255, 152, 0, 0.5);
            animation: flicker 0.3s infinite alternate;
            z-index: 6;
        }
        
        /* 蛋糕盘 */
        .plate {
            width: 320px;
            height: 15px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        /* 樱桃装饰 */
        .cherry {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff0000;
            border-radius: 50%;
            z-index: 7;
            box-shadow: inset -5px -5px 0 rgba(0, 0, 0, 0.2);
        }
        
        .cherry-1 {
            top: 10px;
            left: 30%;
        }
        
        .cherry-2 {
            top: 5px;
            left: 50%;
        }
        
        .cherry-3 {
            top: 10px;
            right: 30%;
        }
        
        @keyframes floatUp {
            to {
                transform: translateY(-100vh) rotate(20deg);
            }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes flicker {
            0%, 100% { 
                transform: translateX(-50%) scale(1); 
                opacity: 0.9;
            }
            50% { 
                transform: translateX(-50%) scale(1.1) translateY(-2px); 
                opacity: 1;
            }
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 20px;
            background: #f00;
            top: -20px;
            animation: confettiFall 5s linear infinite;
        }
        
        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }
        
        /* 操作提示 */
        .instructions {
            font-size: 0.9rem;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 15px;
            border-radius: 10px;
        }
        
        @media (max-width: 768px) {
            .birthday-title {
                font-size: 2.5rem;
            }
            .message {
                font-size: 1.2rem;
            }
            .cake-container {
                width: 220px;
            }
        }
    </style>
</head>
<body>
    <div class="balloons" id="balloons"></div>
    <div class="container">
        <h1 class="birthday-title">🎉 生日快乐！ 🎉</h1>
        
        <div class="message">
            <p>亲爱的 <span class="birthday-person" id="name">[寿星名字]</span>，</p>
            <p>在这特别的日子里，祝你生日快乐！🎂</p>
            <p>愿你的每一天都充满阳光与欢笑，</p>
            <p>愿你的每一个梦想都能成真！</p>
            <p>🎁 心想事成，幸福永远！ 🎁</p>
        </div>
        
        <!-- 改进的蛋糕 -->
        <div class="cake-container">
            <div class="cake">
                <div class="cake-base"></div>
                <div class="cake-middle"></div>
                <div class="cake-top"></div>
                <div class="icing icing-1"></div>
                <div class="icing icing-2"></div>
                <div class="icing icing-3"></div>
                
                <div class="candles">
                    <div class="candle">
                        <div class="flame"></div>
                    </div>
                    <div class="candle">
                        <div class="flame"></div>
                    </div>
                    <div class="candle">
                        <div class="flame"></div>
                    </div>
                </div>
                
                <div class="cherry cherry-1"></div>
                <div class="cherry cherry-2"></div>
                <div class="cherry cherry-3"></div>
                
                <div class="plate"></div>
            </div>
        </div>
        
        <p style="margin-top: 30px; font-size: 1.2rem;">
            🎈 祝福随着气球飘向你的身边 🎈
        </p>
        
        <div class="instructions">
            提示：在URL后添加 ?name=名字 可以自定义寿星名字，例如：?name=小明
        </div>
    </div>

    <script>
        // 创建气球
        function createBalloons() {
            const balloonsContainer = document.getElementById('balloons');
            const colors = ['#ff4081', '#4CAF50', '#2196F3', '#FF9800', '#9C27B0'];
            
            for (let i = 0; i < 20; i++) {
                const balloon = document.createElement('div');
                balloon.className = 'balloon';
                
                // 随机属性
                const left = Math.random() * 100;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const size = 30 + Math.random() * 40;
                const delay = Math.random() * 5;
                const duration = 6 + Math.random() * 6;
                
                balloon.style.left = left + '%';
                balloon.style.background = color;
                balloon.style.width = size + 'px';
                balloon.style.height = size * 1.4 + 'px';
                balloon.style.animationDelay = delay + 's';
                balloon.style.animationDuration = duration + 's';
                
                balloonsContainer.appendChild(balloon);
            }
        }
        
        // 创建彩色纸屑
        function createConfetti() {
            const colors = ['#f00', '#0f0', '#00f', '#ff0', '#f0f', '#0ff'];
            
            setInterval(() => {
                for (let i = 0; i < 10; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    
                    const left = Math.random() * 100;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const delay = Math.random() * 5;
                    const duration = 2 + Math.random() * 3;
                    const rotation = Math.random() * 360;
                    const size = 5 + Math.random() * 10;
                    
                    confetti.style.left = left + '%';
                    confetti.style.background = color;
                    confetti.style.animationDelay = delay + 's';
                    confetti.style.animationDuration = duration + 's';
                    confetti.style.transform = `rotate(${rotation}deg)`;
                    confetti.style.width = size + 'px';
                    confetti.style.height = size + 'px';
                    confetti.style.borderRadius = '50%';
                    
                    document.body.appendChild(confetti);
                    
                    // 5秒后移除
                    setTimeout(() => {
                        if (confetti.parentNode) {
                            confetti.remove();
                        }
                    }, 5000);
                }
            }, 500);
        }
        
        // 修改寿星名字 - 从URL参数获取
        function changeName() {
            // 获取URL参数
            const urlParams = new URLSearchParams(window.location.search);
            let name = urlParams.get('name');
            
            // 如果没有name参数，尝试从hash获取
            if (!name && window.location.hash) {
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                name = hashParams.get('name');
            }
            
            // 如果还没有，使用默认值
            if (!name) {
                name = '寿星';
            }
            
            document.getElementById('name').textContent = name;
            
            // 更新页面标题
            document.title = `生日快乐，${name}！`;
        }
        
        // 蜡烛吹灭效果
        function setupCandleInteraction() {
            const flames = document.querySelectorAll('.flame');
            
            flames.forEach(flame => {
                flame.addEventListener('click', function(e) {
                    e.stopPropagation();
                    
                    // 吹灭蜡烛效果
                    this.style.animation = 'none';
                    this.style.width = '8px';
                    this.style.height = '8px';
                    this.style.background = '#aaa';
                    this.style.boxShadow = '0 0 5px rgba(0,0,0,0.3)';
                    
                    // 添加烟雾效果
                    const smoke = document.createElement('div');
                    smoke.style.position = 'absolute';
                    smoke.style.width = '20px';
                    smoke.style.height = '20px';
                    smoke.style.background = 'rgba(200, 200, 200, 0.8)';
                    smoke.style.borderRadius = '50%';
                    smoke.style.top = '-30px';
                    smoke.style.left = '50%';
                    smoke.style.transform = 'translateX(-50%)';
                    smoke.style.animation = 'floatUp 1.5s ease-out forwards';
                    
                    this.parentElement.appendChild(smoke);
                    
                    setTimeout(() => {
                        smoke.remove();
                    }, 1500);
                });
            });
        }
        
        // 页面加载时执行
        window.onload = function() {
            createBalloons();
            createConfetti();
            changeName();
            setupCandleInteraction();
            
            // 添加点击特效
            document.addEventListener('click', function(e) {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.style.position = 'absolute';
                heart.style.left = e.clientX + 'px';
                heart.style.top = e.clientY + 'px';
                heart.style.fontSize = '25px';
                heart.style.pointerEvents = 'none';
                heart.style.animation = 'floatUp 2s ease-out forwards';
                document.body.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 2000);
            });
            
            // 添加键盘快捷键提示
            console.log('提示：在URL后添加 ?name=名字 可以自定义寿星名字');
            console.log('例如：https://example.com/?name=小明');
        };
        
        // 当URL改变时也更新名字（适用于单页应用）
        window.addEventListener('popstate', changeName);
    </script>
</body>
</html>
</body>
</html>
